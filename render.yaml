services:
  - type: web
    name: kiranasathi-backend
    runtime: node
    plan: free
    region: oregon
    buildCommand: npm install && npm run build:backend
    startCommand: npm run start --workspace=backend
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: FRONTEND_URL
        value: https://*.vercel.app
      - key: MONGODB_URI
        sync: false
